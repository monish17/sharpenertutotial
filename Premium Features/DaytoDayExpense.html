<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(227, 220, 220);
        }
        fieldset{
            background-color:white;
            border: none;
            margin: 0 auto;
            width: 70%;
            text-align: center;
        }
        #DynamicDataTable {
            right: 50%;
        }
        #downloadButton{
            margin-left: 100px;
        }
       
    </style>
</head>
<body>
    <fieldset id="expenseFieldset">
            <h2>DAY TO DAY EXPENSES</h2>
            <div id="DynamicData">
            </div>
            <table id="DynamicDataTable" bgcolor="white">
                <tr bgcolor="grey">
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Income</th>
                    <th >Expenses</th>
                </tr>
            </table>
    </fieldset>
    <br><button id="downloadButton"  onclick="download()">Download Report</button>
<script src="DaytoDayExpense.js"></script>
</body>
</html>
