<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ExpenseTracker.css">
    
</head>
<body>
    <div id="UpperDiv"></div>
    <div id="PremiumButton"><br><button id="rzp-button">Buy Premium</button><br><br></div>
    <div class="container">
    <div class="ledger">
        <h2>Expense Tracker</h2>
        <h4>Your Balance</h4>
        <h1 id="balance">₹0.00</h1>
        <div class="inc-exp-container">
            <div class="inc">
                <h4>Income</h4>
                <p id="inc-amt" class="amt plus">₹0.00</p>
            </div>
            <div class="exp">
                <h4>Expense</h4>
                <p id="exp-amt" class="amt minus">₹0.00</p>
            </div>
        </div>
        <!-- <div id="err-message"></div> -->
        <form action="#" id="form">
            <div id="toggle-container">
                <span id="income" class="toggle-button active">Income</span> | 
                <span id="expense" class="toggle-button">Expense</span>
            </div>
            <div class="form-control">
                <label for="desc">Description</label>
                <input type="text" name="desc" id="desc" placeholder="Enter Description" required>
            </div>
            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="number" name="amount" id="amount" placeholder="Enter Amount" required>
            </div>
            <button class="btn" type="submit">Add Transaction</button>
        </form>
    </div>
    <div class="transaction">
        <div id="Page-Input" >
            <label for="rowsCategory" >Rows per page</label>
            <input list="noOfPages" id="rowsCategory" class="Page-Input" name="rowsCategory" style="width: 40px;" value="5">
            <datalist id="noOfPages">
                <option value="5">
                <option value="10">
            </datalist>
            </div>
        <h3>Transaction Details</h3>
        <ul class="trans" id="trans">
            <!-- <li class="exp">Insurance
                <span>-1500</span>
                <button class="btn-del">X</button>
            </li>
            <li class="inc">
                Salary
                <span>35000</span>
                <button class="btn-del">X</button>
            </li>
            <li class="exp">Food
                <span>-300</span>
                <button class="btn-del">X</button>
            </li> -->
        </ul>
        <div id="paginationDiv"></div>
    </div>
   </div>
   <div id="PremiumDiv">
   </div>
   <div id="model" class="hidden">
    <div id="model-content">
    </div>
   </div>
   <script src="http://checkout.razorpay.com/v1/checkout.js"></script>
   <script src="http://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
   <script src="ExpenseTracker.js"></script>
</body>
</html>
