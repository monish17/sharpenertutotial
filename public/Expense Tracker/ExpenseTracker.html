<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src="https://checkout.razorpay.com/v1/checkout.js"></script> -->

    <title>Project</title>
    <style>
        .centered-fieldset{
            text-align: center;
            border: 5px solid #000;
            margin: auto;
            padding: auto;
            background-color: #f0f0f0;
            width: 1000px;
        }
        #rzp-button{
            text-align: right;
        }
        #Leaderboard-Table{
            display: none;
        }
        #downloadedFiles{
            text-align: justify;
            border: 2px solid #000;
            /* margin: auto;
            padding: auto; */
            background-color: #f0f0f0;
            width: 500px;
        }
        #Page-Input{
            /* text-align: right; */
            position: relative;
            left: 76%;
        }
    </style>
</head>
<body>
    <button id="rzp-button">Buy Premium</button>
    <!-- <script src="https://checkout.razopay.com/v1/checkout.js"></script> -->
    <div id="header"></div>
    <fieldset class="centered-fieldset">
        <form id="form">
            <h2>Expense Tracker</h2>
            <input type="hidden" id="uniqueId" name="uniqueId" value="">
            <label for="expense-amount">Choose Expense Amount</label><br>
            <input type="number" id="expenseAmount" class="Expense-input" name="Expense"><br>
            <label for="description">Description</label><br>
            <input list="Description" id="description" class="Expense-input" name="Description">
            <datalist id="Description">
                <option value="Travel">
                <option value="Movies">
                <option value="Education Expense">
                <option value="Fuel Cost">
            </datalist><br>
            <label for="category">Expense category</label><br>
            <input list="Expenses" id="category" class="Expense-input" name="Category">
            <datalist id="Expenses">
                <option value="Food Expense">
                <option value="Entertainment">
                <option value="Rental Expense">
                <option value="Traveling Expense">
            </datalist><br>
            <button>Add Expense</button>
            
        </form>
    </fieldset><br>
    <div id="Page-Input" >
    <label for="rowsCategory" >Rows per page</label>
    <input list="noOfPages" id="rowsCategory" class="Page-Input" name="rowsCategory" style="width: 40px;">
    <datalist id="noOfPages">
        <option value="5">
        <option value="10">
        <option value="15">
        <option value="20">
    </datalist>
    </div>
    <fieldset id="Expense-fieldset" class="centered-fieldset">
        <h3>Your Expense Details</h3>
        <ul id="ul"></ul>
        <br><div id="paginationDiv"></div>
    </fieldset>
    <br><br><div id="premiumDiv">
        <div class="centered-fieldset" id="Leaderboard-Table">
            <h3>Leader Board</h3>
        </div>
    </div>
    <br><br><br><div id="downloadedFilesDiv">
        <fieldset id="downloadedFiles">
            <h3 style="text-align: center;">Downloaded Files</h3>
        </fieldset>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <script src="ExpenseTracker.js"></script>
    
</body>
</html>
