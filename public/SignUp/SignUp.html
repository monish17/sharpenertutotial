<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="SignUp.css">
</head>
<body>
    <div class="container">
        <div id="div1">
            <img src="../Image Folder/Messaging symbol.jpg" alt="signUpImage" id="signUpImage">
        </div>
        <div id="div2">
            <h2>Registration Form</h2>
            <div id="msg"></div>
            <form id="signUpForm">
                <input type="text" placeholder="Enter your Name " required id="nameInput">
                <br><br><input type="text" placeholder="Enter Email Id" required id="emailInput">
                <br><br><input type="number" placeholder="Enter Phone Number" required id="PhoneNumberInput">
                <br><br><input type="text" placeholder="Enter a Password" required id="passwordInput">
                <br><br><button id="signUpButton">Sign Up</button>
                <br><p>Already an user  <a href="../SignIn/SignIn.html">Sign In</a> here </p>
            </form>
        </div>
    </div>
    <script src="http://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
    
    <script src="SignUp.js"></script>
</body>
</html>
