<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        background-color: cadetblue;
    }
    fieldset {
      background-color: #ccc;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 5px;
      margin: 0;
      width: 280px;
      height: 250px;
      margin: 0 auto;
      text-align: center;
    }
    .modal {
      display: none;
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 30px;
      background-color: #a7a0a0;
      border: 1px solid #555151;
      min-height: 250px;
      width: 250px;
      
    }
    .close {
      position: absolute;
      top: 20px;
      right: 10px;
      cursor: pointer;
      background-color: red;
      color: rgb(245, 241, 241);
      font-size: 20px;
    }
    
    </style>
</head>
<body>
    <fieldset>
        <form id="myForm"> 
            <h2>Sign In</h2>
            <div id="msg"></div>
            <label for="Email">Email Id</label><br>
            <input type="text" id="Email" name="Email Id"><br>
            <label for="Password">Password</label><br>
            <input type="text" id="Password" name="Password"><br><br>
            <button id="SignInbutton">Sign In</button> 
        </form>
    </fieldset>
      <button id="forgotPassword" onclick="openModel()">Forget Password</button>
    
    <div id="modal" class="modal">
        <button class="close" onclick="closeModal()">&times;</button>
        <h3>Enter Email Id</h3><br>
        <input type="text" name="forgotPasswordInput" id="emailInput"><br><br>
        <button id="sendEmail">Send OTP</button>
        <h4>Any OTP will be Sent to the Entered Email ID</h4>
    </div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.0/axios.min.js"></script>
<script src="SignInFrontend.js"></script>
</html>
